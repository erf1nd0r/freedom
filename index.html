<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freedom</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0f12;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #field {
    font-size: clamp(11px, 1.6vw, 17px);
    line-height: 1.55;
    letter-spacing: 0.04em;
    white-space: pre;
    margin: 0;
    padding: 2rem;
  }
  #field .noise {
    color: #3d5a63;
  }
  #field .locked {
    color: #e9e4d6;
    transition: color 1.2s ease;
  }
  #field .flash {
    color: #ffffff;
    text-shadow: 0 0 8px rgba(233, 228, 214, 0.55);
  }
  #hint {
    color: #2c3a40;
    font-size: 11px;
    letter-spacing: 0.2em;
    margin-top: 1.5rem;
    opacity: 0;
    transition: opacity 3s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  #hint.show {
    opacity: 1;
  }
</style>
</head>
<body>
<pre id="field" aria-label="a letter assembling itself out of noise"></pre>
<div id="hint">press anything to scatter it again</div>
<script src="engine.js"></script>
<script src="letter.js"></script>
<script src="render.js"></script>
</body>
</html>
